# fly.toml app configuration file generated for morita-lp-razor on 2026-06-27T14:48:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'morita-lp-razor'
primary_region = 'gru'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Storefront__DataProtectionKeyDirectory = "/var/morita/data-protection-keys"
  Storefront__PublicAssistantEnabled = "false"

# Provision before deploying this mount:
# fly volumes create data_protection --app morita-lp-razor --region gru --size 1
[[mounts]]
  source = "data_protection"
  destination = "/var/morita/data-protection-keys"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
