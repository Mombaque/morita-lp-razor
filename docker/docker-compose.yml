name: morita-lp-razor

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Storefront__DataProtectionKeyDirectory=/var/morita/data-protection-keys
      - CatalogApi__BaseUrl=http://api:5001
    volumes:
      - ..:/src
      - razor-data-protection:/var/morita/data-protection-keys
    networks:
      - default
      - backend-dev-network
    develop:
      watch:
        - action: rebuild
          path: ..

volumes:
  razor-data-protection:

networks:
  backend-dev-network:
    external: true
